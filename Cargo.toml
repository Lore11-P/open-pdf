[package]
name = "open-pdf"
version = "1.0.0"
edition = "2021"
description = "Open PDF - lettore e editor PDF locale con interfaccia Glassmorphism"
authors = ["Open PDF"]
build = "build.rs"

[[bin]]
# Server MCP per gli agenti AI: stesso codice dell'app, avvio da console.
name = "open-pdf-mcp"
path = "src/mcp_server.rs"
test = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
pdfium-render = "0.9.5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp", "tiff", "tga", "ico", "dds", "exr", "hdr", "pnm", "qoi"] }
lopdf = "0.47"
zip = { version = "2", default-features = false, features = ["deflate"] }
similar = "2"
tiny_http = "0.12"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
chrono = "0.4"
rasn = "0.30"
rasn-cms = "0.30"
rasn-pkix = "0.30"
rsa = { version = "0.9", features = ["sha2", "pem"] }
sha2 = "0.10"
keystore-pkcs12 = "1.0"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
p384 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
ocsp = "0.4"
